<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="夜间巡灯。每天一张地图，点亮属于你的城市。">
  <title>NIGHT SHIFT · 夜间巡灯</title>
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg">
    <symbol id="lamp-icon" viewBox="0 0 32 32"><path d="M9 28V10a5 5 0 0 1 5-5h9M6 28h7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M17 5h9l2 4H16Z" fill="currentColor"/><path d="m20 12-1 2m5-2v2m4-2 1 2" stroke="currentColor" stroke-linecap="round"/></symbol>
    <symbol id="box-icon" viewBox="0 0 32 32"><rect x="6" y="6" width="20" height="22" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 11h14m-4 5h3m-12 8h7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="16" r="1.5" fill="currentColor"/></symbol>
  </svg>
  <div class="shell">
    <header class="masthead">
      <a class="wordmark" href="./" aria-label="夜间巡灯首页"><svg aria-hidden="true"><use href="#lamp-icon"/></svg>NIGHT SHIFT</a>
      <span class="header-status"><i></i>每日解谜</span>
    </header>
    <main id="home" class="home view">
      <section class="intro" aria-labelledby="game-title">
        <div class="title-group">
          <p class="eyebrow"><span></span>NIGHT SHIFT</p>
          <h1 id="game-title">夜间巡灯</h1>
          <p class="tagline">每天一张地图，点亮属于你的城市。</p>
        </div>
        <div class="daily">
          <p class="day"><span>DAY</span> <strong id="day">—</strong></p>
          <div class="date-line"><time id="date"></time><span>北京时间</span></div>
        </div>
        <div class="actions">
          <button id="start" class="primary" disabled><span>开始挑战</span><span aria-hidden="true">→</span></button>
          <p id="availability" class="availability" role="status"></p>
          <div class="links">
            <button data-dialog="rules">游戏规则 <span aria-hidden="true">↗</span></button>
            <button data-dialog="ranking">今日排行榜 <span aria-hidden="true">↗</span></button>
          </div>
        </div>
      </section>
      <figure class="scene" aria-label="一盏暖黄色路灯照亮深蓝夜色中的金属电箱和街道">
        <picture class="fallback">
          <source media="(max-width: 720px)" srcset="./assets/scene-mobile.webp">
          <img src="./assets/scene-desktop.webp" alt="">
        </picture>
        <div id="render-surface" aria-hidden="true"></div>
      </figure>
    </main>
    <main id="game" class="game view" hidden>
      <div class="game-head"><button id="back" class="text-button">← 返回首页</button><button data-dialog="rules" class="text-button">游戏规则 ↗</button></div>
      <p id="game-label" class="eyebrow"></p>
      <h1 id="game-title-board" tabindex="-1">夜间巡灯</h1>
      <div id="game-mount"></div>
    </main>
    <footer class="footer"><span>© 2026 PaJii Studio</span><span>ASIA / SHANGHAI</span></footer>
  </div>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-head"><div><p id="dialog-kicker"></p><h2 id="dialog-title"></h2></div><button id="close-dialog" aria-label="关闭">×</button></div>
    <div id="dialog-content"></div>
  </dialog>
  <script src="./app.js" type="module"></script>
</body>
</html>
